 <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test jwplayer6 </title>
<script src="https://zoptv.github.io/jwplayer6/jwplayer.js"></script>
<script type="text/javascript">jwplayer.key="XyKDz1KFv2iEARyRM3oiWyoVrkFdkJldRpaH93FuHJE=";</script>
<style>
body {
  min-height: 100vh; /* Set minimum height to viewport height */
    margin: 0; /* Remove default margin */
    display: flex; /* Use flexbox for layout */
    flex-direction: column; /* Stack elements vertically */

font-family: "Helvetica Neue", Arial, sans-serif;

}
.container {
display: flex;
justify-content: center;
//margin-top: 20px;
//width: 845px; 
}

input[type="text"] {
padding: 10px;  
width: 90%;
max-width: 710px;
border: 1px solid #ccc;  border-radius: 5px 0 0 5px;  outline: none;
}

button {
padding: 10px 20px; background-color: #007bff; color: white; border: 1px solid #007bff; border-radius: 0 5px 5px 0; cursor: pointer;
}
button:hover {
background-color: #0056b3;
}

#jwplayer-container {
width: 98%;
max-width: 800px;
//height:404px;
border-radius: 6px;
border: 1px solid #ccc;
z-index:1; 
margin:3px;}

@media only screen and (max-width:980px) {#jwplayer-container {width:99%;height:auto;}}

footer {
background-color: #000;
color: white;
text-align: center;
flex-shrink: 0; /* Prevent footer from shrinking */
margin-top: auto; /* Push footer to the bottom */
padding: 0rem; 
}
</style>

</head><body>

<center><h2> Test jwplayer6 </h2>




<div class="container">
<input type="text" id="video-url" autocomplete="on" value="https://raw.githack.com/kicktv/html-editor/gh-pages/video.mp4">
<button type="submit" id="play-btn">Play</button>
</div>
       
<div id="jwplayer-container"></div> 

</center>

 <footer><p>&copy; 2025 JW Player Application. All rights reserved.</p> </footer>

<script>
        // Initialize JW Player
        jwplayer("jwplayer-container").setup({
            file: "https://uptv.pages.dev/2.mp4",
            width: "98%",
            aspectratio: "16:9",
            autostart: "false",
            stretching: "exactfit",
            type: "video/flash",
            controls: "true"
        });

        // Play button functionality
        document.getElementById('play-btn').addEventListener('click', function() {
            const videoUrl = document.getElementById('video-url').value;
            if (videoUrl) {
                jwplayer("jwplayer-container").load([{
                    file: videoUrl
                }]);
                jwplayer("jwplayer-container").play();
            } else {
                alert("Please enter a video URL");
            }
        });


    </script>

</body></html>
